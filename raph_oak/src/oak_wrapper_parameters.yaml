raph_oak:
  tf_frame_prefix:
    type: string
    default_value: ""
    description: Prefix of the TF frame ids of all published messages (e.g. "robot1/"), for when the robot description is loaded with a prefix
    read_only: true
  device:
    id:
      type: string
      default_value: ""
      description: Device ID to connect to.
      read_only: true
    usb_port_id:
      type: string
      default_value: ""
      description: USB port ID to connect to (e.g. 1.1.2)
      read_only: true
    ir_laser_dot_projector_intensity:
      type: double
      default_value: 0.3
      description: IR laser dot projector intensity (0.0-1.0, higher is stronger intensity)
      validation:
        bounds<>: [0.0, 1.0]
    ir_laser_dot_projector_lazy:
      type: bool
      default_value: true
      description: If true, the IR laser dot projector will only be turned on when the depth stream is active. If false, the IR laser dot projector will be always on.
    ir_flood_light_intensity:
      type: double
      default_value: 0.0
      description: IR flood light intensity (0.0-1.0, higher is stronger intensity)
      validation:
        bounds<>: [0.0, 1.0]
  depth:
    confidence_threshold:
      type: int
      default_value: 15
      description: Depth images will only contain pixels where depth confidence is below the confidence threshold (lower the confidence value means better depth accuracy)
      validation:
        bounds<>: [0, 255]
    lr_check_enabled:
      type: bool
      default_value: true
      description: Computes and combines disparities in both L-R and R-L directions, and combine them
    lr_check_threshold:
      type: int
      default_value: 10
      description: Disparity is considered for the output when the difference between LR and RL disparities is smaller than the LR check threshold
      validation:
        bounds<>: [0, 255]
    subpixel_enabled:
      type: bool
      default_value: true
      description: Computes disparity with sub-pixel interpolation
    subpixel_fractional_bits:
      type: int
      default_value: 3
      description: Number of fractional bits for subpixel mode
      validation:
        bounds<>: [3, 5]
    extended_disparity_enabled:
      type: bool
      default_value: false
      description: Extends the disparity range from 95 to 190 by combining full resolution and downscaled images. Suitable for short range objects
    min_distance:
      type: double
      default_value: 0.0
      description: Minimal distance in meters
      validation:
        bounds<>: [0.0, 60.0]
    max_distance:
      type: double
      default_value: 10.0
      description: Maximal distance in meters
      validation:
        bounds<>: [0.0, 60.0]
  pointcloud:
    max_rate:
      type: int
      default_value: 5
      description: Maximum point cloud rate in frames per second. The depth frames feeding the point cloud are limited to this rate, so less is computed on the host and nothing above it is published. Values above the depth rate have no effect
      validation:
        bounds<>: [1, 60]
  nn:
    enabled:
      type: bool
      default_value: false
      description: Run a neural network on its own output of the RGB camera and publish its results. The kind of the model (detection, classification or segmentation, with or without masks) is taken from its NNArchive
      read_only: true
    model:
      type: string
      default_value: "luxonis/yolov6-nano:r2-coco-512x384"
      description: Path to a local NNArchive file (.tar.xz) or, if no such file exists, a Luxonis Model Zoo slug (e.g. luxonis/yolov6-nano:r2-coco-512x384). A zoo slug requires internet access on the first run.
      read_only: true
    fps:
      type: double
      default_value: 5.0
      description: Frame rate of the camera output feeding the neural network, which is also the inference rate
      validation:
        bounds<>: [1.0, 30.0]
      read_only: true
    confidence_threshold:
      type: double
      default_value: 0.5
      description: Detections with a lower confidence are discarded on the device. Only used by detection models
      validation:
        bounds<>: [0.0, 1.0]
      read_only: true
    num_shaves:
      type: int
      default_value: 3
      description: Number of SHAVE cores the network is compiled for. The resources left over by the rest of the pipeline limit this. If it does not fit, the pipeline fails to start and the device names the available count.
      validation:
        bounds<>: [1, 16]
      read_only: true
  mono:
    width:
      type: int
      default_value: 1280
      description: Mono camera image width
      validation:
        bounds<>: [1, 1280]
      read_only: true
    height:
      type: int
      default_value: 800
      description: Mono camera image height
      validation:
        bounds<>: [1, 800]
      read_only: true
    fps:
      type: double
      default_value: 10.0
      description: Mono camera frames per second
      validation:
        bounds<>: [0.1, 60.0]
      read_only: true
  mono_compressed:
    jpeg_quality:
      type: int
      default_value: 80
      description: JPEG quality for mono compressed images (0-100, higher is better quality and bigger size)
      validation:
        bounds<>: [0, 100]
      read_only: true
  rgb:
    width:
      type: int
      default_value: 1344
      description: RGB camera image width
      validation:
        bounds<>: [1, 3840]
      read_only: true
    height:
      type: int
      default_value: 1008
      description: RGB camera image height
      validation:
        bounds<>: [1, 2160]
      read_only: true
    fps:
      type: double
      default_value: 15.0
      description: RGB camera frames per second
      validation:
        bounds<>: [0.1, 30.0]
      read_only: true
    rect_alpha_scaling:
      type: double
      default_value: -1.0
      description: Free scaling parameter of the undistorted RGB image (rgb_rect) computed on the camera. 0 keeps only valid pixels, 1 keeps all source pixels, -1 uses the DepthAI default
      validation:
        bounds<>: [-1.0, 1.0]
      read_only: true
  rgb_compressed:
    jpeg_quality:
      type: int
      default_value: 80
      description: JPEG quality for RGB compressed images (0-100, higher is better quality and bigger size)
      validation:
        bounds<>: [0, 100]
      read_only: true
